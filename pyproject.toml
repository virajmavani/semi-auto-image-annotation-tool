[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anno-mage"
version = "2.0.2"
description = "Semi-automatic image annotation tool with AI-assisted object detection"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "Pillow>=10.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pascal-voc-writer>=0.1.4",
    "pydantic>=2.5.0",
]

[project.scripts]
anno-mage = "anno_mage.cli:main"

[tool.setuptools.packages.find]
include = ["anno_mage*", "models*", "web*"]
exclude = ["web.frontend*"]

[tool.setuptools.package-data]
"anno_mage" = ["static/**/*"]
